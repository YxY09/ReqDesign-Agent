# ReqDesign-Agent 配置文件

llm:
  # 可选: openai, anthropic, deepseek, qwen
  provider: openai
  model: gpt-4o
  api_key: ""  # 留空则从环境变量读取
  base_url: ""  # 自定义API地址，留空使用默认
  temperature: 0.3
  max_tokens: 4096

retry:
  max_retries: 3

output:
  default_dir: outputs/

logging:
  level: INFO
  log_dir: logs/
