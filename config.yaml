# LLM Provider Configuration (aligned with Python version)

llm:
  provider: qwen
  model: qwen3.5-flash
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  temperature: 0.3
  max_tokens: 32768
  timeout: 120

retry:
  max_retries: 3

output:
  default_dir: outputs/

logging:
  level: INFO
  log_dir: logs/
