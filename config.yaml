# ReqDesign-Agent 配置文件

llm:
  # 可选: openai, anthropic, deepseek, qwen
  provider: anthropic
  model: mimo-v2.5-pro
  api_key: ""  # 留空则从环境变量读取
  base_url: ""  # 自定义API地址，留空使用默认
  temperature: 0.3
  max_tokens: 8192

retry:
  max_retries: 3

output:
  default_dir: outputs/

logging:
  level: INFO
  log_dir: logs/

governance:
  enabled: false
  trace_enabled: true
  human_checkpoints: []  # 如 ["requirement_analysis", "diagram_generation"]
  max_repair_rounds: 3
  gate_thresholds:
    syntax_valid: true
    min_completeness: 0.8
    min_consistency: 0.7
